<h1>✅ 去水印解析服务（EdgeOne Pages）</h1>
<div class="card">解析接口：<br><code>/api/parse?url=&lt;分享链接或口令&gt;</code><br><code>/api/dewatermark/parseurl</code>（PUT/POST/GET）</div>
<div class="card">媒体代理：<br><code>/api/proxy?url=&lt;媒体直链&gt;</code></div>
<div class="card">版本信息：<br><code>/api/version</code></div>
<p>支持：抖音、哔哩哔哩（本地解析）；小红书、快手等（自动回退）。</p>
